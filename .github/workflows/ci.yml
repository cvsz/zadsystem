name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify immutable GitHub Actions pins
        run: python scripts/verify_action_pins.py
      - name: Install dependencies from validated constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Audit root Python environment
        run: python -m pip_audit
      - name: Audit deployable FastAPI backend dependencies
        env:
          PIP_CONSTRAINT: web_app/backend/constraints.txt
        run: python -m pip_audit --requirement web_app/backend/requirements.txt
      - name: Build and verify immutable wheelhouse evidence
        run: |
          mkdir -p artifacts/wheelhouse/root artifacts/wheelhouse/backend artifacts/wheelhouse/manifests
          python -m pip download --only-binary=:all: --dest artifacts/wheelhouse/root -c constraints.txt -r requirements.txt
          python -m pip download --only-binary=:all: --dest artifacts/wheelhouse/backend -c web_app/backend/constraints.txt -r web_app/backend/requirements.txt
          sha256sum -c supply-chain/python312-ubuntu2404-root.sha256
          sha256sum -c supply-chain/python312-ubuntu2404-backend.sha256
          find artifacts/wheelhouse/root -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/wheelhouse/manifests/root.sha256
          find artifacts/wheelhouse/backend -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/wheelhouse/manifests/backend.sha256
          cmp supply-chain/python312-ubuntu2404-root.sha256 artifacts/wheelhouse/manifests/root.sha256
          cmp supply-chain/python312-ubuntu2404-backend.sha256 artifacts/wheelhouse/manifests/backend.sha256
      - name: Verify offline installation from trusted wheelhouses
        run: |
          python -m venv .venv-root-offline
          .venv-root-offline/bin/python -m pip install --no-index --find-links artifacts/wheelhouse/root -c constraints.txt -r requirements.txt
          .venv-root-offline/bin/python -m pip check
          python -m venv .venv-backend-offline
          .venv-backend-offline/bin/python -m pip install --no-index --find-links artifacts/wheelhouse/backend -c web_app/backend/constraints.txt -r web_app/backend/requirements.txt
          .venv-backend-offline/bin/python -m pip check
          PYTHONPATH=web_app/backend .venv-backend-offline/bin/python -c "import main; assert main.app is not None"
      - name: Generate CycloneDX dependency SBOM evidence
        run: |
          mkdir -p artifacts/sbom
          PIP_CONSTRAINT=constraints.txt python -m pip_audit --requirement requirements.txt --format cyclonedx-json --output artifacts/sbom/root.cdx.json
          PIP_CONSTRAINT=web_app/backend/constraints.txt python -m pip_audit --requirement web_app/backend/requirements.txt --format cyclonedx-json --output artifacts/sbom/backend.cdx.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def canonical(name: str) -> str:
              return name.lower().replace('_', '-').replace('.', '-')

          def read_constraints(path: Path) -> dict[str, str]:
              result = {}
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  name, version = line.split('==', 1)
                  result[canonical(name)] = version
              return result

          pairs = (
              (Path('artifacts/sbom/root.cdx.json'), Path('constraints.txt')),
              (Path('artifacts/sbom/backend.cdx.json'), Path('web_app/backend/constraints.txt')),
          )
          for sbom_path, constraints_path in pairs:
              data = json.loads(sbom_path.read_text(encoding='utf-8'))
              if data.get('bomFormat') != 'CycloneDX' or not data.get('components'):
                  raise SystemExit(f'invalid or empty CycloneDX SBOM: {sbom_path}')
              actual = {canonical(c['name']): c['version'] for c in data['components']}
              expected = read_constraints(constraints_path)
              if actual != expected:
                  missing = sorted(set(expected) - set(actual))
                  extra = sorted(set(actual) - set(expected))
                  changed = sorted(name for name in set(actual) & set(expected) if actual[name] != expected[name])
                  raise SystemExit(
                      f'SBOM/constraint drift for {sbom_path}: missing={missing}, extra={extra}, changed={changed}'
                  )
              print(f'{sbom_path}: {len(actual)} constrained components verified')

          provenance = {
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'tested_sha': os.environ['TESTED_SHA'],
              'checkout_semantics': 'pull_request runs test GitHub merge ref; push runs test the pushed commit',
              'dependency_resolution': 'Python 3.12 / ubuntu-24.04 transitive versions constrained by repository constraint files',
              'artifact_integrity': 'downloaded runtime wheels are verified against committed SHA-256 manifests before offline installation',
              'trusted_hash_baseline': 'committed manifests were promoted from successful CI artifact 10323307198 / run 34776291869 and are independently enforced on subsequent runs',
          }
          Path('artifacts/sbom/provenance.json').write_text(
              json.dumps(provenance, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-evidence-${{ env.SOURCE_HEAD_SHA }}
          path: |
            artifacts/sbom/*.cdx.json
            artifacts/sbom/provenance.json
            artifacts/wheelhouse/manifests/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test deployable FastAPI backend dependencies
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/python -m pip install --upgrade pip
          .venv-backend/bin/python -m pip install -c web_app/backend/constraints.txt -r web_app/backend/requirements.txt
          .venv-backend/bin/python -m pip check
          PYTHONPATH=web_app/backend .venv-backend/bin/python -c "import main; assert main.app is not None"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
