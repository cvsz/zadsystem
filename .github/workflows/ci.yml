name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify immutable GitHub Actions pins
        run: python scripts/verify_action_pins.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Audit root Python environment
        run: python -m pip_audit
      - name: Audit deployable FastAPI backend dependencies
        run: python -m pip_audit --requirement web_app/backend/requirements.txt
      - name: Smoke-test deployable FastAPI backend dependencies
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/python -m pip install --upgrade pip
          .venv-backend/bin/python -m pip install -r web_app/backend/requirements.txt
          .venv-backend/bin/python -m pip check
          PYTHONPATH=web_app/backend .venv-backend/bin/python -c "import main; assert main.app is not None"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
