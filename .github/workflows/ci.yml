name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify immutable GitHub Actions pins
        run: python scripts/verify_action_pins.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Audit root Python environment
        run: python -m pip_audit
      - name: Audit deployable FastAPI backend dependencies
        run: python -m pip_audit --requirement web_app/backend/requirements.txt
      - name: Generate CycloneDX dependency SBOM evidence
        run: |
          mkdir -p artifacts/sbom
          python -m pip_audit --requirement requirements.txt --format cyclonedx-json --output artifacts/sbom/root.cdx.json
          python -m pip_audit --requirement web_app/backend/requirements.txt --format cyclonedx-json --output artifacts/sbom/backend.cdx.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sboms = (Path('artifacts/sbom/root.cdx.json'), Path('artifacts/sbom/backend.cdx.json'))
          for path in sboms:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('bomFormat') != 'CycloneDX' or not data.get('components'):
                  raise SystemExit(f'invalid or empty CycloneDX SBOM: {path}')
              print(f'{path}: {len(data["components"])} components')

          provenance = {
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'tested_sha': os.environ['TESTED_SHA'],
              'checkout_semantics': 'pull_request runs test GitHub merge ref; push runs test the pushed commit',
          }
          Path('artifacts/sbom/provenance.json').write_text(
              json.dumps(provenance, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload dependency SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sboms-${{ env.SOURCE_HEAD_SHA }}
          path: |
            artifacts/sbom/*.cdx.json
            artifacts/sbom/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test deployable FastAPI backend dependencies
        run: |
          python -m venv .venv-backend
          .venv-backend/bin/python -m pip install --upgrade pip
          .venv-backend/bin/python -m pip install -r web_app/backend/requirements.txt
          .venv-backend/bin/python -m pip check
          PYTHONPATH=web_app/backend .venv-backend/bin/python -c "import main; assert main.app is not None"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
